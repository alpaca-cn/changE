# 测试的数据目录必须与工作目录无关：这里用绝对路径，正是为了让初始化器
# 拿到「已经绝对」的输入仍然照常创建目录并放行，同时保证测试永远不会碰到真实数据。
change.data-dir=${user.dir}/target/data

# 关掉启动时导入：否则每个 @SpringBootTest 都会往共享库塞 876 行，
# 而 TrainingRepoTest 也要插一个叫 "Plank" 的动作（数据集里就有），
# 会撞 ux_exercise_name_en。导入本身由 ExerciseImportServiceTest 显式调用覆盖；
# 启动钩子是否真的会导入由 ExerciseImportRunnerTest 用独立库文件验证。
change.exercise.import-on-startup=false
