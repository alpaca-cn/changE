spring.application.name=change-spike
server.port=0

# SQLite锛氬崟鏂囦欢锛屾斁鍦ㄦ瀯寤虹洰褰曢噷锛屼笉姹℃煋椤圭洰
spring.datasource.url=jdbc:sqlite:./target/spike.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway 鍏堝叧鎺夛細杩欎竴姝ュ彧楠岃瘉椹卞姩涓庢柟瑷€锛岃縼绉诲崟鐙獙
spring.flyway.enabled=true

# Redis 鎸囧悜閭ｅ彴铏氭嫙鏈猴紱瀹冮€氬父鏄叧鐫€鐨?鈥斺€?姝ｅソ楠岃瘉銆屼笉鍦ㄤ篃鑳藉惎鍔ㄣ€?spring.data.redis.host=192.168.100.128
spring.data.redis.port=6379
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms

logging.level.root=WARN
logging.level.com.change=INFO

