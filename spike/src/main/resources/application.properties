spring.application.name=change-spike
server.port=0

# SQLite：单文件，放在构建目录里，不污染项目
spring.datasource.url=jdbc:sqlite:./target/spike.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway 先关掉：这一步只验证驱动与方言，迁移单独验
spring.flyway.enabled=false

# Redis 指向那台虚拟机；它通常是关着的 —— 正好验证「不在也能启动」
spring.data.redis.host=192.168.100.128
spring.data.redis.port=6379
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms

logging.level.root=WARN
logging.level.com.change=INFO
