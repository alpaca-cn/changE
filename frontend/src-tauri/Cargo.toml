[package]
name = "change"
version = "0.1.0"
description = "changE —— 健身记录客户端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "change_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.0.0-rc.5"
